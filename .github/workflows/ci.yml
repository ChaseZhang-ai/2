name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce benchmarks (smoke)
        run: PYTHONPATH=. python examples/bench_numbers.py
      - name: CLI smoke test
        run: |
          python -m zhulu plan model_image --input product.png
          python -m zhulu schedule examples/configs/jobs.json
          python -m zhulu voc examples/configs/reviews.txt
          python -m zhulu angles "ceramic mug" -n 5
      - name: Examples smoke test
        run: |
          PYTHONPATH=. python examples/generate_model_image.py
          PYTHONPATH=. python examples/run_workflow.py
